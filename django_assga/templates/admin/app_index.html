{% extends "admin/app_index.html" %}
{% load static %}

{% block content %}
<div class="assga-core-brand">
    <img src="{% static 'imagens/Assga_foto.jpg' %}" alt="Logo da ASSGA">
    <div>
        <strong>ASSGA</strong>
        <span>Logo da ASSGA · Gestão Institucional</span>
    </div>
</div>
{{ block.super }}
{% endblock %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        .assga-core-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 18px;
            padding: 12px 16px;
            background: #003366;
            border-left: 5px solid #c62828;
            color: #ffffff;
        }
        .assga-core-brand img {
            width: 52px;
            height: 52px;
            object-fit: cover;
            border-radius: 6px;
            background: #ffffff;
        }
        .assga-core-brand strong,
        .assga-core-brand span {
            display: block;
        }
        .assga-core-brand strong {
            font-size: 21px;
        }
        .assga-core-brand span {
            font-size: 12px;
            opacity: 0.85;
        }
    </style>
{% endblock %}
