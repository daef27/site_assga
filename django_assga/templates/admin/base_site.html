{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
    {{ block.super }}
    <link rel="icon" type="image/jpeg" href="{% static 'imagens/Assga_foto.jpg' %}">
    <link rel="apple-touch-icon" href="{% static 'imagens/Assga_foto.jpg' %}">
    <style>
        #branding {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #branding .assga-admin-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            text-decoration: none;
        }
        #branding .assga-admin-brand img {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 6px;
            background: #ffffff;
        }
        #branding .assga-admin-brand strong {
            font-size: 20px;
            letter-spacing: 0.04em;
        }
        #branding .assga-admin-brand span {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.8;
        }
    </style>
{% endblock %}

{% block branding %}
    <a href="{% url 'admin:index' %}" class="assga-admin-brand" aria-label="Logo da ASSGA - Nome: ASSGA">
        <img src="{% static 'imagens/Assga_foto.jpg' %}" alt="Logo da ASSGA">
        <strong>ASSGA</strong>
        <span>Gestão Institucional</span>
    </a>
{% endblock %}
