{% extends "admin/index.html" %}
{% load static %}

{% block content %}
<div class="assga-admin-list-brand">
    <img src="{% static 'imagens/Assga_foto.jpg' %}" alt="Logo da ASSGA">
    <div>
        <strong>ASSGA</strong>
        <span>Gestão Institucional</span>
    </div>
</div>
{{ block.super }}
{% endblock %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        .assga-admin-list-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 0 0 20px;
            padding: 14px 18px;
            border-left: 5px solid #c62828;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 51, 102, 0.15);
        }
        .assga-admin-list-brand img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 7px;
        }
        .assga-admin-list-brand strong,
        .assga-admin-list-brand span {
            display: block;
        }
        .assga-admin-list-brand strong {
            color: #003366;
            font-size: 22px;
        }
        .assga-admin-list-brand span {
            color: #004aad;
            font-size: 13px;
        }
    </style>
{% endblock %}
